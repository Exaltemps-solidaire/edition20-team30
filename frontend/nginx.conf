# Sert l'export statique de Next.js (out/). Les routes /api/ et /_reveil sont prises par le proxy d'entrée.
#
# nginx : dès qu'un `location` déclare un `add_header`, il n'hérite plus des `add_header`
# du niveau `server`. Les en-têtes de sécurité sont donc répétés dans chaque location qui
# ajoute un Cache-Control, pour ne pas perdre la CSP sur index.html.
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

  # Paquets hashés de Next (_next/static) : immuables, cache long.
  location /_next/static/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html : jamais mis en cache, sinon un onglet ouvert garde l'ancien bundle après déploiement.
  location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Contrôles de santé : fichiers statiques public/health et public/sante.
  location ~ ^/(health|sante)$ {
    default_type text/plain;
  }

  # Repli des routes profondes vers index.html (export statique à une seule page pour l'instant).
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
